<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emar English Series - Grade 1 Pupil's Book</title>
<style>
  :root {
    --paper: #fbf8f1;
    --ink: #eef0f7;
    --accent: #e8a33d;
    --cover: #7a1f2b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 50% 30%, #4a4e69, #22223b);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding: 12px;
  }
  h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    opacity: 0.9;
    text-align: center;
  }

  /* Hard cover board */
  .book {
    position: relative;
    padding: 14px;
    max-width: 96vw;
    max-height: 72vh;
    overflow: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    border-radius: 10px;
    background: linear-gradient(145deg, #8a2a36, var(--cover) 45%, #4d1219);
    box-shadow:
      0 30px 40px -10px rgba(0, 0, 0, 0.6),
      inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  /* Book block */
  .stage {
    position: relative;
    width: min(calc(94vw - 28px), calc((72vh - 28px) * 0.73206));
    aspect-ratio: 0.73206;
    transform-origin: top left;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-x pan-y;
  }
  .stage.dragging { cursor: grabbing; }
  .stage.placing { cursor: crosshair; }
  .stage.drawing { cursor: crosshair; }

  .slot {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    background: var(--paper);
    overflow: hidden;
  }
  .slot-l {
    left: 0;
    border-radius: 3px 0 0 3px;
    box-shadow: -1px 1px 0 #e4ddc9, -2px 2px 0 #cfc6ae, -3px 3px 0 #e8e1cf, -4px 3px 0 #c4bba2;
  }
  .slot-r {
    left: 50%;
    border-radius: 0 3px 3px 0;
    box-shadow: 1px 1px 0 #e4ddc9, 2px 2px 0 #cfc6ae, 3px 3px 0 #e8e1cf, 4px 3px 0 #c4bba2;
  }
  .stage .slot-l { display: none; }
  .stage .slot-r { left: 0; width: 100%; border-radius: 3px; }
  .stage.turning .rf-layer,
  .stage.turning .rf-draw-layer,
  .stage.turning .rf-write-area,
  .stage.turning .rf-choice-layer { visibility: hidden; }
  .slot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* Gutter shadow in two-page view */
  .stage:not(.single)::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 60px;
    margin-left: -30px;
    background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.22) 50%, transparent);
    pointer-events: none;
    z-index: 5;
  }

  /* Canvas that draws the bending page */
  #fx {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 9;
    pointer-events: none;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font: inherit;
    color: #22223b;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    width: 44px;
    height: 44px;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: 0.35; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .info {
    min-width: 160px;
    text-align: center;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: min(70vw, 420px);
    accent-color: var(--accent);
  }
  .hint {
    font-size: 13px;
    opacity: 0.7;
    text-align: center;
  }

.rf-ex-row{position:absolute;z-index:12;transform:translate(0,-50%);display:flex;gap:5px;align-items:center;pointer-events:auto;white-space:nowrap}
.rf-ex-row>*{position:static!important;transform:none!important;margin:0}
.rf-retry{width:auto;height:auto;min-width:0;min-height:0;max-width:none;padding:3px 8px;margin:0;border:1px solid #6b7a99;border-radius:14px;background:#fff;color:#22223b;font:inherit;font-size:11px;line-height:1.2;white-space:nowrap;cursor:pointer;font-weight:bolder;}
.rf-plain-prompt{position:absolute;z-index:12;max-width:70%;font-size:13px;line-height:1.4;color:#1b1b2f;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 2px #fff;text-align:start;pointer-events:none;white-space:pre-line}
.rf-blank-input{position:absolute;z-index:12;box-sizing:border-box;padding:0 4px;border:0;border-bottom:2px solid #2d6cdf;border-radius:0;background:transparent;color:#111;font:inherit;font-size:15px;text-align:center;pointer-events:auto}
.rf-blank-input.rf-fill-ok{border-bottom-color:#16843b;color:#0f6b2e}
.rf-blank-input.rf-fill-no{border-bottom-color:#d82e3f;color:#b1202e}
.rf-answer-input{position:absolute;z-index:12;width:40%;box-sizing:border-box;padding:4px 6px;border:0;border-bottom:2px solid #2d6cdf;border-radius:0;background:transparent;color:#111;font:inherit;font-size:14px;pointer-events:auto}
.rf-blank-placeholder{position:absolute;z-index:11;box-sizing:border-box;border:1px dashed #2d6cdf;background:#ffffff80;pointer-events:none}
.rf-blank-drag{pointer-events:auto;cursor:move;touch-action:none}
.rf-resize{position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;border:1px solid #fff;border-radius:3px;background:#1674d1;cursor:nwse-resize;touch-action:none;pointer-events:auto}
</style>
</head>

  <h1>Emar English Series &middot; Grade 1 Pupil's Book</h1>

  <div class="book">
    <div class="stage" id="stage" aria-label="Book. Click or drag a page corner to turn a page.">
      <div class="slot slot-l" id="slotL"></div>
      <div class="slot slot-r" id="slotR"></div>
      <canvas id="fx"></canvas>
    </div>
  </div>

  <div class="controls">
    <button id="prev" aria-label="Previous page">&#8249;</button>

  <input type="range" id="scrub" min="0" value="0" aria-label="Jump to page">

<script>
(function(){
 const $=id=>document.getElementById(id), KEY='rafeeq.flipbook.activities.v1';
 let activities=Array.isArray(window.RF_ACTIVITIES)?window.RF_ACTIVITIES:[];
 if(!Array.isArray(window.RF_ACTIVITIES)){try{activities=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}}
 let teacher=false, editing=null, placement=null, pointPlacement=null, choicePlacement=null, blankPlacement=null, activeStroke=null, activeMatchId=null, activeMatchDrag=null;
 const status=t=>$('rf-status').textContent=t;
const ERASER_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.1 2.9a2.2 2.2 0 0 1 3.1 0l3 3a2.2 2.2 0 0 1 0 3.1L12.6 18.8H19v2H7.5L2.9 16.2a2.2 2.2 0 0 1 0-3.1zM6.3 16.9l3.6 3.6 1.9-1.9-3.6-3.6z"/></svg>';
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(activities));return true;}catch(e){status('تعذر الحفظ: حجم البيانات كبير.');return false;}};
 function clearAllContent(silent){
   activities=[];save();
   for(const k of Object.keys(drawings))delete drawings[k];
   try{localStorage.setItem(DRAW_KEY,JSON.stringify(drawings));}catch(e){}
   for(const k of Object.keys(writingDrawings))delete writingDrawings[k];
   saveWritingDrawings();
   renderPins();
   if(!silent)status('تم مسح كل الأنشطة والرسومات.');
 }
 const availableSpeechVoices=()=>('speechSynthesis'in window?speechSynthesis.getVoices():[]);
 function refreshSpeechVoiceOptions(){
   const select=$('rf-voice'),selected=select.value||editing?.voiceURI||'';
   const voices=availableSpeechVoices();
   select.replaceChildren(new Option('الصوت المناسب تلقائياً',''));
   voices.forEach(voice=>select.add(new Option(voice.name+' ('+voice.lang+')',voice.voiceURI)));
   if(selected&&voices.some(voice=>voice.voiceURI===selected))select.value=selected;
   $('rf-voice-help').textContent=voices.some(voice=>voice.lang.toLowerCase().startsWith('ar'))
     ?'يمكنك اختيار أي صوت من القائمة أو استخدام الصوت العربي تلقائياً.'
     :'لا يظهر صوت عربي في هذا المتصفح. في Windows افتح الإعدادات ← الوقت واللغة ← اللغة والمنطقة، أضف العربية وثبّت ميزة تحويل النص إلى كلام إن توفرت، ثم أعد تشغيل المتصفح وأعد تحميل الكتاب. جرّب أيضاً Microsoft Edge بعد تثبيت الصوت. لا تُرسل النصوص إلى خدمة خارجية.';
 }
 if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',refreshSpeechVoiceOptions);
 function waitForVoices(timeout=2000){
   return new Promise(resolve=>{
     if(!('speechSynthesis'in window))return resolve([]);
     const current=speechSynthesis.getVoices();
     if(current.length)return resolve(current);
     let timer=null;
     const done=()=>{speechSynthesis.removeEventListener('voiceschanged',done);clearTimeout(timer);resolve(speechSynthesis.getVoices());};
     speechSynthesis.addEventListener('voiceschanged',done);
     timer=setTimeout(done,timeout);
   });
 }
 async function speakActivityText(activity){
   if(!activity.text||!activity.text.trim()){status('لم يُضف نص قراءة لهذا النشاط بعد.');return;}
   if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){status('المتصفح لا يدعم قراءة النص صوتياً.');return;}
   const voices=await waitForVoices();
   const arabicText=/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(activity.text);
   const language=arabicText?'ar':(activity.lang||'ar');
   const utterance=new SpeechSynthesisUtterance(activity.text);
   utterance.lang={ar:'ar-SA',en:'en-US',fr:'fr-FR'}[language]||language;
   const selectedVoice=activity.voiceURI&&voices.find(voice=>voice.voiceURI===activity.voiceURI);
   const matchingVoice=voices.find(voice=>voice.lang.toLowerCase().startsWith(language.toLowerCase()));

 function renderTeacherBlanks(slot,a){

     if(!box)return;

       if(!e.isPrimary||e.button!==0)return;
       e.preventDefault();e.stopPropagation();e.currentTarget.setPointerCapture(e.pointerId);
       drag={id:e.pointerId,resizing,sx:e.clientX,sy:e.clientY,moved:false,orig:{x:box.x,y:box.y,width:box.width,height:box.height}};
     };

       else{box.x=Math.max(0,Math.min(100-box.width,drag.orig.x+dx));box.y=Math.max(0,Math.min(100-box.height,drag.orig.y+dy));}
       place();
     };
     const finish=(e,cancelled)=>{
       if(!drag||drag.id!==e.pointerId)return;
       const cur=drag;drag=null;
       if(cancelled){Object.assign(box,cur.orig);renderPins();return;}
       if(!cur.moved){edit(a);return;}
       if(!save()){Object.assign(box,cur.orig);status('تعذّر حفظ موضع الفراغ.');renderPins();return;}
       status('تم حفظ موضع الفراغ.');renderPins();

 function renderMatch(slot,a){

   if(teacher){
     if((pointPlacement&&pointPlacement.activity.id===a.id)||Array.isArray(a.matchPoints)){
       const overlay=document.createElement('div');overlay.className='rf-match-overlay';
       const shown=pointPlacement&&pointPlacement.activity.id===a.id?pointPlacement.points:points;

         const point=pair&&pair[side];if(!point)return;
         const dot=document.createElement('button');dot.type='button';dot.className='rf-match-point preview';dot.dataset.side=side;dot.style.left=(point.x*100)+'%';dot.style.top=(point.y*100)+'%';dot.setAttribute('aria-label',side==='left'?'نقطة الصورة':'نقطة الإجابة');

   const svg=svgEl('svg');svg.setAttribute('class','rf-match-svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');overlay.appendChild(svg);
   const toPercent=e=>{const r=overlay.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];};
   const pathD=pts=>pts.map((q,i)=>(i?'L':'M')+(q[0]*100).toFixed(2)+' '+(q[1]*100).toFixed(2)).join(' ');
   const links=Array.isArray(matchAnswers[a.id])?matchAnswers[a.id]:[];
   links.forEach(link=>{

   };
   points.forEach((pair,index)=>['left','right'].forEach(side=>{

     dot.style.left=(pt.x*100)+'%';dot.style.top=(pt.y*100)+'%';dot.setAttribute('aria-label',side==='left'?'نقطة الصورة':'نقطة الإجابة');

       const path=current.side==='left'?current.path:current.path.slice().reverse();
       const previous=Array.isArray(matchAnswers[a.id])?matchAnswers[a.id].slice():[];
       const next=previous.filter(link=>link.from!==leftIndex&&link.to!==rightIndex);

 function renderExercise(a,workspace){
   const answer=studentAnswers[a.id]||{};

           feedback.textContent='';feedback.className='rf-feedback';
         });
         inputs.push(input);sentence.appendChild(input);
       }
     });
     box.appendChild(sentence);
     button('تحقق',()=>{

       report(ok,ok?'أحسنت! إجابة صحيحة':'حاول مرة أخرى');

         const line=document.createElementNS('http://www.w3.org/2000/svg','line');
         line.setAttribute('x1',String(aRect.right-rect.left));line.setAttribute('y1',String(aRect.top+aRect.height/2-rect.top));
         line.setAttribute('x2',String(bRect.left-rect.left));line.setAttribute('y2',String(bRect.top+bRect.height/2-rect.top));
         lines.appendChild(line);

     });

   }

   workspace.appendChild(box);

  const imgHTML = (i) => (i == null ? "" : '<img alt="Page ' + (i + 1) + '" draggable="false" src="' + src(i) + '">');
  const setSlot = (el, i) => { el.innerHTML = imgHTML(i);el.dataset.pageIndex=i==null?'':String(i+1); };
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  /* ---------- sizing and image cache ---------- */

  function sizeCanvas() {
    W = stage.offsetWidth;
    H = stage.offsetHeight;
    dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(W * dpr)), h = Math.max(1, Math.round(H * dpr));
    if (fx.width !== w || fx.height !== h) {
      fx.width = w; fx.height = h;
      off.width = w; off.height = h;
    }
  }

  function clearFx() {
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.clearRect(0, 0, fx.width, fx.height);
  }

  const imgCache = new Map();
  function getImg(i) {
    if (i == null) return null;
    let im = imgCache.get(i);
    if (!im) {
      im = new Image();
      im.onload = () => { if (turn) drawTurn(); };
      im.src = src(i);
      imgCache.set(i, im);
    }
    return im;
  }
  const ready = (im) => !!im && im.complete && im.naturalWidth > 0;
  function preload(p) {
    for (let k = p - 2; k <= p + 2; k++) {
      if (k < 0 || k >= spreads.length) continue;
      for (const i of spreads[k]) if (i != null) getImg(i);
    }
  }

  /* ---------- static state ---------- */

  function updateUI() {
    const [L, R] = spreads[pos];
    let label;
    if (mode === "single") {
      label = "Page " + (R + 1) + " of " + N;
    } else if (L == null && R === 0) {
      label = "Front cover";
    } else if (R == null) {
      label = "Page " + (L + 1) + " of " + N;
    } else {
      label = "Pages " + (L + 1) + "\u2013" + (R + 1) + " of " + N;
    }
    info.textContent = label;
    prevBtn.disabled = pos === 0;
    nextBtn.disabled = pos === spreads.length - 1;
    scrub.max = spreads.length - 1;
    scrub.value = pos;
  }

  function renderStatic() {
    clearFx();
    const [L, R] = spreads[pos];
    setSlot(slotL, L);
    setSlot(slotR, R);
    document.dispatchEvent(new Event("bookpageschange"));
    updateUI();
    preload(pos);
  }

  function setMode(m) {
    mode = m;
    spreads = m === "single" ? spreadsSingle : spreadsDouble;
    stage.classList.toggle("single", m === "single");
  }

  function applyLayout() {
    const want = "single";
    sizeCanvas();
    if (want === mode) return;
    const cur = spreads[pos];
    const page = cur[1] != null ? cur[1] : cur[0];
    setMode(want);
    pos = want === "single" ? page : (page === 0 ? 0 : Math.ceil(page / 2));
    renderStatic();
  }

  /* ---------- geometry helpers ---------- */

  // Polygon of the rectangle x0..x1, 0..H, clipped to the half-plane sign*(n.q - d) >= 0
  function clipRect(x0, y0, x1, y1, nx, ny, d, sign) {
    const poly = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
    const f = (q) => sign * (nx * q[0] + ny * q[1] - d);
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const A = poly[i], B = poly[(i + 1) % poly.length];
      const fa = f(A), fb = f(B);
      if (fa >= 0) out.push(A);
      if ((fa >= 0) !== (fb >= 0)) {
        const t = fa / (fa - fb);
        out.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]);
      }
    }
    return out;
  }

  function polyPath(ctx, pts) {
    ctx.beginPath();
    pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
    ctx.closePath();
  }

  /* ---------- turning ---------- */

  function startTurn(dir, bottom) {
    const target = pos + dir;
    if (target < 0 || target >= spreads.length) return null;
    const single = mode === "single", fwd = dir > 0;
    const nxt = spreads[target];
    sizeCanvas();
    clearFx();
    preload(target);
    return {
      fwd,
      target,
      p: 0,
      bottom,
      // Page on the back of the turning leaf
      backIdx: fwd ? (single ? nxt[1] : nxt[0]) : nxt[1],
      // Page revealed beneath the leaf once it has lifted off
      revealIdx: single || fwd ? nxt[1] : nxt[0],
      // Starting fold angle: the fold runs from the grabbed corner toward the spine
      th0: fwd ? (bottom ? Math.PI / 3 : -Math.PI / 3)
                : (bottom ? 2 * Math.PI / 3 : 4 * Math.PI / 3)
    };
  }

  /* Draw the turning page at progress t.p (0 = flat, 1 = turned over).
     The fold line passes through the grabbed corner. As p grows, the corner moves
     to the spine and the fold line rotates to vertical, so the page curls up from
     the corner and then lays flat on the other side. */
  function drawTurn() {
    const t = turn;
    if (!t) return;
    const single = mode === "single", fwd = t.fwd, p = t.p;
    const Pw = single ? W : W / 2;               // width of the leaf's page
    const x0 = single ? 0 : (fwd ? W / 2 : 0);   // leaf's rest position
    const x1 = x0 + Pw;
    const Xs = single ? (fwd ? 0 : W) : W / 2;   // spine x
    const Cx = fwd ? W : 0;                      // free outer edge x

    const Dx = Cx + (Xs - Cx) * p;               // grabbed corner moves toward spine
    const Dy = t.bottom ? H : 0;
    const th = t.th0 + ((fwd ? 0 : Math.PI) - t.th0) * p;
    const nx = Math.cos(th), ny = Math.sin(th);
    const d = nx * Dx + ny * Dy;                 // fold line: n . q = d
    const px = nx * d, py = ny * d;              // a point on the fold line
    const fade = Math.sin(Math.PI * p);          // 0 at rest and when fully turned

    const fol = clipRect(x0, 0, x1, H, nx, ny, d, 1);   // part of the page that lifts

    clearFx();
    const ctx = fctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 1. Page revealed where the leaf has lifted, with a soft shadow next to the fold
    const rv = getImg(t.revealIdx);
    if (fol.length > 2 && ready(rv)) {
      ctx.save();
      polyPath(ctx, fol);
      ctx.clip();
      ctx.drawImage(rv, x0, 0, Pw, H);
      const g = ctx.createLinearGradient(px, py, px + nx * Pw * 0.3, py + ny * Pw * 0.3);
      g.addColorStop(0, "rgba(0,0,0," + (0.35 * fade).toFixed(3) + ")");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(x0, 0, Pw, H);
      ctx.restore();
    }

    // 2. The lifted page: its back, mirrored across the fold line
    const bi = getImg(t.backIdx);
    if (fol.length > 2 && ready(bi)) {
      const a = 1 - 2 * nx * nx;
      const b = -2 * nx * ny;
      const dd = 1 - 2 * ny * ny;
      const e = 2 * d * nx;
      const f = 2 * d * ny;

      octx.setTransform(1, 0, 0, 1, 0, 0);
      octx.clearRect(0, 0, off.width, off.height);
      octx.save();
      // Reflection across the fold line, scaled to device pixels
      octx.setTransform(dpr * a, dpr * b, dpr * b, dpr * dd, dpr * e, dpr * f);
      polyPath(octx, fol);
      octx.clip();
      octx.save();
      octx.translate(x1, 0);
      octx.scale(-1, 1);                          // back side is mirrored on the paper
      octx.drawImage(bi, 0, 0, Pw, H);
      octx.restore();
      // Shade the lifted page a little, darkest near the fold
      const g = octx.createLinearGradient(px, py, px + nx * Pw * 0.6, py + ny * Pw * 0.6);
      g.addColorStop(0, "rgba(0,0,0," + (0.25 * fade).toFixed(3) + ")");
      g.addColorStop(1, "rgba(0,0,0,0)");
      octx.fillStyle = g;
      octx.fillRect(x0, 0, Pw, H);
      octx.restore();

      // Draw the flap onto the page with a soft cast shadow
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.shadowColor = "rgba(0,0,0," + (0.4 * fade).toFixed(3) + ")";
      ctx.shadowBlur = 18 * dpr;
      ctx.shadowOffsetX = 4 * dpr;
      ctx.shadowOffsetY = 6 * dpr;
      ctx.drawImage(off, 0, 0);
      ctx.restore();
    }
  }

  function setP(t, p) {
    t.p = clamp(p, 0, 1);
    drawTurn();
  }

  function animateTo(t, to, done) {
    cancelAnimationFrame(animId);
    const from = t.p;
    const dur = Math.max(180, DUR * Math.abs(to - from));
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      setP(t, from + (to - from) * easeInOut(k));
      if (k < 1) animId = requestAnimationFrame(step);
      else done();
    };
    animId = requestAnimationFrame(step);
  }

  function finishTurn(t) {
    pos = t.target;
    turn = null;
    stage.classList.remove("turning");
    renderStatic();
  }

  function cancelTurn() {
    turn = null;
    stage.classList.remove("turning");
    renderStatic();
  }

  // Buttons and keyboard: animated turn from the bottom corner
  function flip(dir, bottom) {
    if (turn || drag) return;
    if (stage.classList.contains("drawing")) {
      document.getElementById("rf-draw").click();
    }
    const t = startTurn(dir, bottom === undefined ? true : bottom);
    if (!t) return;
    turn = t;
    stage.classList.add("turning");
    animateTo(t, 1, () => finishTurn(t));
  }

  /* ---------- pointer: turn pages only from the outer corners ---------- */

  stage.addEventListener("pointerdown", (e) => {
    if (turn || drag) return;
    if (stage.classList.contains("placing")) return;
    if (stage.classList.contains("drawing") || e.button !== 0 ||
        e.target.closest("button, input, textarea, select, label, .rf-write-area, .rf-choice-layer, .rf-match-overlay, .rf-match-prompt, .rf-ex-row, .rf-blank-input, .rf-answer-input, .rf-blank-drag, .rf-pin, .rf-match-point, #rf-toolbar, .controls, #scrub")) return;
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const cornerWidth = rect.width * 0.2;
    const cornerHeight = rect.height * 0.18;
    const fromLeftCorner = x <= cornerWidth && (y <= cornerHeight || y >= rect.height - cornerHeight);
    const fromRightCorner = x >= rect.width - cornerWidth && (y <= cornerHeight || y >= rect.height - cornerHeight);
    if (!fromLeftCorner && !fromRightCorner) return;
    if (e.isTrusted) stage.setPointerCapture(e.pointerId);
    drag = {
      id: e.pointerId,
      sx: e.clientX,
      lastX: e.clientX,
      lastT: performance.now(),
      vel: 0,
      half: mode === "single" ? rect.width : rect.width / 2,
      clickDir: fromLeftCorner ? -1 : 1,
      bottom: y > rect.height / 2,
      dir: 0,
      t: null
    };
  });

  stage.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.sx;

    const now = performance.now();
    const dt = Math.max(1, now - drag.lastT);
    drag.vel = (e.clientX - drag.lastX) / dt;   // px per ms
    drag.lastX = e.clientX;
    drag.lastT = now;

    if (!drag.t) {
      if (Math.abs(dx) < 6) return;
      drag.dir = dx < 0 ? 1 : -1;
      drag.t = startTurn(drag.dir, drag.bottom);
      if (!drag.t) { drag.dir = 0; return; }
      turn = drag.t;
      stage.classList.add("turning");
      stage.classList.add("dragging");
    }

    // Pulling distance maps to progress; the corner follows the finger
    const pull = drag.dir > 0 ? -dx : dx;
    setP(drag.t, pull / drag.half);
  });

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    stage.classList.remove("dragging");

    if (!d.t) {
      if (e.type === "pointerup") flip(d.clickDir, true);
      return;
    }

    const t = d.t;
    const flick = Math.abs(d.vel) > 0.6 && Math.sign(d.vel) === (d.dir > 0 ? -1 : 1);
    if (t.p > 0.5 || flick) {
      animateTo(t, 1, () => finishTurn(t));
    } else {
      animateTo(t, 0, () => cancelTurn());
    }
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  /* ---------- controls ---------- */

  prevBtn.addEventListener("click", () => flip(-1, true));
  nextBtn.addEventListener("click", () => flip(1, true));

  scrub.addEventListener("input", () => {
    if (turn || drag) return;
    if (stage.classList.contains("drawing")) document.getElementById("rf-draw").click();
    pos = Number(scrub.value);
    renderStatic();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); flip(1, true); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); flip(-1, true); }
    else if (e.key === "Home" && !turn && !drag) { if(stage.classList.contains("drawing"))document.getElementById("rf-draw").click();pos = 0; renderStatic(); }
    else if (e.key === "End" && !turn && !drag) { if(stage.classList.contains("drawing"))document.getElementById("rf-draw").click();pos = spreads.length - 1; renderStatic(); }
  });

  window.addEventListener("resize", () => { if (!turn && !drag) applyLayout(); });
  document.addEventListener("booksourcechange", () => {
    N = Array.isArray(window.RF_PAGE_DATA) ? window.RF_PAGE_DATA.length : 105;
    if (!N) throw new Error("The book must contain at least one page.");
    rebuildSpreads();
    pos = 0;
    turn = null;
    drag = null;
    stage.classList.remove("turning", "dragging");
    imgCache.clear();
    sizeCanvas();
    renderStatic();
  });

  /* ---------- start ---------- */
  setMode("single");
  pos = 0;
  sizeCanvas();
  renderStatic();
})();
</script>
</body>
</html>
